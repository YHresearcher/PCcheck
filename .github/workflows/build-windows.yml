# Build An Tâm PC check trên GitHub Actions (Windows).
# Mỗi lần PUSH lên main và BUILD THÀNH CÔNG: tạo Release MỚI với tag
# build-<run_number>-<run_attempt>, đánh dấu Latest. Không ghi đè release cũ.
# Với pull_request: chỉ build + artifact để kiểm thử, không tạo Release.
# workflow_dispatch dùng để build thử thủ công, không tạo Release chính thức.
# File portable cùng tên AnTamPCtest-portable.zip để link Latest ổn định.
# Bản đang phát hành trước đây với tag "latest" được giữ nguyên (không xóa).
name: Build Windows portable

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# contents: write là bắt buộc để tạo / cập nhật Release bằng gh CLI;
# nếu để read thì bước Release sẽ lỗi 403 và không có file ở Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore toàn bộ solution (bao gồm các plugin build bằng MSBuild target)
        run: dotnet restore "验机软件.slnx"

      - name: Publish FurMark trước (đúng thứ tự, không đổi)
        run: dotnet publish FurMark/FurMark.csproj -p:PublishProfile=FolderProfile

      - name: Publish app chính
        # Thư mục 验机软件 giữ nguyên tên gốc, vì đổi tên sẽ làm hỏng đường dẫn trong solution và csproj.
        run: dotnet publish "验机软件/验机软件.csproj" -p:PublishProfile=FolderProfile

      - name: Xóa thư mục ngôn ngữ runtime không dùng (fr, cs, de...)
        # Publish tự chứa (SelfContained) kèm theo thư mục vệ tinh ngôn ngữ của
        # .NET runtime (cs, de, es, fr, ...). App chỉ dùng tiếng Việt viết sẵn
        # trong XAML/code, không dùng các ngôn ngữ này, nên xóa để zip nhẹ hơn
        # và USB khỏi chật. Xóa cũng không crash app (.NET fallback về tiếng Anh
        # cho thông báo framework nếu cần). Chỉ xóa đúng danh sách này ở 2 chỗ
        # (runtime app chính + runtime FurMark trong Tools), không đụng Tools/,
        # plugins/ hay file nào khác. Thư mục không có thì Test-Path bỏ qua.
        run: |
          $locales = @('cs','de','es','fr','it','ja','ko','pl','pt-BR','ru','tr','zh-Hans','zh-Hant')
          $roots = @('publish', 'publish\Tools\furmark')
          foreach ($root in $roots) {
            foreach ($loc in $locales) {
              $dir = Join-Path $root $loc
              if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            }
          }

      - name: Liệt kê thư mục publish
        run: Get-ChildItem publish | Select-Object Name, Length

      - name: Đóng gói portable làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnTamPCtest-portable
          path: publish/**
          if-no-files-found: error

      - name: Nén thư mục publish thành zip cho Releases
        # Nén nội dung bên trong publish (không nén cả thư mục publish),
        # để giải nén ra là chạy ngay, không phải chui thêm 1 cấp thư mục.
        run: Compress-Archive -Path publish\* -DestinationPath AnTamPCtest-portable.zip -Force

      - name: Phát hành phiên bản MỚI — không ghi đè bản cũ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "build-${{ github.run_number }}-${{ github.run_attempt }}"
          $name = "An Tâm PC check — Build #${{ github.run_number }}"
          $notes = @"
          Bản Windows Portable được build thành công từ nhánh main.

          - Commit: ${{ github.sha }}
          - Workflow run: #${{ github.run_number }} (lần chạy ${{ github.run_attempt }})
          - Tải AnTamPCtest-portable.zip, giải nén rồi chạy AnTamPCtest.exe trên Windows.
          - Nếu máy chưa cấp quyền Admin, một số cảm biến / SMART có thể không khả dụng.
          - Các release cũ được giữ nguyên để có thể quay lại bản trước.
          "@
          gh release create $tag "AnTamPCtest-portable.zip" --target "${{ github.sha }}" --title $name --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Không tạo được Release $tag" }
