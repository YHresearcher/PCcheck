# Build An Tâm PC test trên máy chủ Windows của GitHub, không cần máy Windows ở nhà.
# Cách dùng: push repo này lên GitHub, chờ build xong, tải file
# AnTamPCtest-portable.zip ở mục Releases (Release "latest", luôn là bản mới nhất
# từ nhánh main) về, giải nén ra USB là chạy được trên máy Windows. Tải ở Releases
# không cần đăng nhập GitHub, khác với artifact ở Actions (cần đăng nhập).
# Artifact "AnTamPCtest-portable" vẫn giữ lại làm bản dự phòng cho dev.
# Chạy tự động mỗi lần push lên main (để push bằng deploy key cũng tự build được,
# không cần gọi API workflow_dispatch), và vẫn bấm tay chạy lại được khi cần.
# Release "latest" chỉ được cập nhật khi build thành công, nên bản lỗi không
# ghi đè lên bản tốt đang phát hành.
name: Build Windows portable

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write là bắt buộc để tạo / cập nhật Release bằng gh CLI;
# nếu để read thì bước Release sẽ lỗi 403 và không có file ở Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore toàn bộ solution (bao gồm các plugin build bằng MSBuild target)
        run: dotnet restore "验机软件.slnx"

      - name: Publish FurMark trước (đúng thứ tự, không đổi)
        run: dotnet publish FurMark/FurMark.csproj -p:PublishProfile=FolderProfile

      - name: Publish app chính
        # Thư mục 验机软件 giữ nguyên tên gốc, vì đổi tên sẽ làm hỏng đường dẫn trong solution và csproj.
        run: dotnet publish "验机软件/验机软件.csproj" -p:PublishProfile=FolderProfile

      - name: Xóa thư mục ngôn ngữ runtime không dùng (fr, cs, de...)
        # Publish tự chứa (SelfContained) kèm theo thư mục vệ tinh ngôn ngữ của
        # .NET runtime (cs, de, es, fr, ...). App chỉ dùng tiếng Việt viết sẵn
        # trong XAML/code, không dùng các ngôn ngữ này, nên xóa để zip nhẹ hơn
        # và USB khỏi chật. Xóa cũng không crash app (.NET fallback về tiếng Anh
        # cho thông báo framework nếu cần). Chỉ xóa đúng danh sách này ở 2 chỗ
        # (runtime app chính + runtime FurMark trong Tools), không đụng Tools/,
        # plugins/ hay file nào khác. Thư mục không có thì Test-Path bỏ qua.
        run: |
          $locales = @('cs','de','es','fr','it','ja','ko','pl','pt-BR','ru','tr','zh-Hans','zh-Hant')
          $roots = @('publish', 'publish\Tools\furmark')
          foreach ($root in $roots) {
            foreach ($loc in $locales) {
              $dir = Join-Path $root $loc
              if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            }
          }

      - name: Liệt kê thư mục publish
        run: Get-ChildItem publish | Select-Object Name, Length

      - name: Đóng gói portable làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnTamPCtest-portable
          path: publish/**
          if-no-files-found: error

      - name: Nén thư mục publish thành zip cho Releases
        # Nén nội dung bên trong publish (không nén cả thư mục publish),
        # để giải nén ra là chạy ngay, không phải chui thêm 1 cấp thư mục.
        run: Compress-Archive -Path publish\* -DestinationPath AnTamPCtest-portable.zip -Force

      - name: Tạo / cập nhật Release "latest"
        # Release "latest" là 1 Release duy nhất, cập nhật liên tục, không tạo
        # Release mới mỗi lần push (tránh spam danh sách Releases).
        # Link tải ổn định, không cần đăng nhập:
        # https://github.com/YHresearcher/PCcheck/releases/latest/download/AnTamPCtest-portable.zip
        # gh CLI có sẵn trên runner, xác thực bằng GITHUB_TOKEN của workflow.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest AnTamPCtest-portable.zip --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest AnTamPCtest-portable.zip --title "An Tâm PC test — bản mới nhất" --notes "Bản portable mới nhất từ nhánh main, commit ${{ github.sha }}. Tải file AnTamPCtest-portable.zip, giải nén ra USB là chạy trên máy Windows (cần quyền Admin)."
          }
